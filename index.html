<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PSY0 Trainer</title>
    <script>
      // Appliqué AVANT le premier rendu : sans ça, l'écran clignote en sombre
      // le temps que React démarre. La clé doit rester alignée sur
      // THEME_STORAGE_KEY (src/core/theme.ts).
      (function () {
        try {
          var pref = localStorage.getItem('psy0.theme') || 'systeme';
          var dark =
            pref === 'sombre' ||
            (pref !== 'clair' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
