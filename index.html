<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PSY0 Trainer est un outil indépendant de préparation aux exercices psychotechniques et à la culture aéronautique des sélections pilotes." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://psy.makht.art/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PSY0 Trainer" />
    <meta property="og:description" content="Entraînement indépendant aux exercices PSY0 et à la culture aéronautique." />
    <meta property="og:url" content="https://psy.makht.art/" />
    <title>PSY0 Trainer</title>
    <script>
      // Appliqué AVANT le premier rendu : sans ça, l'écran clignote en sombre
      // le temps que React démarre. La clé doit rester alignée sur
      // THEME_STORAGE_KEY (src/core/theme.ts).
      (function () {
        try {
          var pref = localStorage.getItem('psy0.theme') || 'systeme';
          var dark =
            pref === 'sombre' ||
            (pref !== 'clair' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <main>
        <h1>PSY0 Trainer</h1>
        <p>Application indépendante de préparation aux sélections pilotes : exercices psychotechniques, cours visuel Cubes 2D/3D et Culture Aéro.</p>
        <nav aria-label="Sections principales">
          <a href="/cubes">Cubes 2D/3D</a>
          <a href="/culture">Culture Aéro</a>
        </nav>
        <p>PSY0 Trainer n’est ni un service officiel d’Air France, ni affilié à Pilotest.</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
